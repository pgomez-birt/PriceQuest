<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BolsaSmart - Ranking de empresas</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:#f5f7fa; color:#1f2937; }
    header { background:#0f172a; color:white; padding:24px; }
    header .contenedor, main { width:min(1100px, calc(100% - 32px)); margin:0 auto; }
    header h1 { margin:0 0 6px; font-size:1.8rem; }
    header p { margin:0; color:#cbd5e1; }
    main { padding:28px 0 50px; }
    .aviso { background:#fff8db; border:1px solid #eadb8f; border-radius:10px; padding:12px 16px; margin-bottom:22px; }
    .panel { background:white; border:1px solid #e5e7eb; border-radius:14px; overflow:hidden; }
    .panel-cabecera { display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; padding:20px; border-bottom:1px solid #e5e7eb; }
    .panel-cabecera h2 { margin:0 0 4px; }
    .panel-cabecera p { margin:0; color:#6b7280; }
    label { display:flex; flex-direction:column; gap:6px; font-weight:bold; }
    select { min-width:230px; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; background:white; font:inherit; }
    .tabla-wrapper { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:760px; }
    th, td { padding:15px 16px; text-align:right; border-bottom:1px solid #edf0f3; }
    th { color:#64748b; background:#fafafa; font-size:.86rem; text-transform:uppercase; letter-spacing:.03em; }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align:left; }
    tbody tr { transition:background .15s ease; }
    tbody tr:hover { background:#f6f9ff; }
    .puesto { font-weight:bold; font-size:1.1rem; }
    .empresa { display:flex; flex-direction:column; gap:3px; }
    .empresa strong { font-size:1rem; }
    .ticker { color:#6b7280; font-size:.85rem; }
    .positivo { color:#137333; font-weight:bold; }
    .negativo { color:#b3261e; font-weight:bold; }
    @media (max-width:600px) {
      header { padding:20px 0; }
      select { min-width:100%; }
      .panel-cabecera label { width:100%; }
    }
  </style>
</head>
<body>
<header>
  <div class="contenedor">
    <h1>BolsaSmart</h1>
    <p>Ejemplo de Interfaz de Resumen</p>
  </div>
</header>

<main>
  <div class="aviso">
    <strong>Ejemplo didáctico:</strong>
    los datos de esta interfaz son ficticios y solo muestran cómo podría funcionar un ranking interactivo.
  </div>

  <section class="panel">
    <div class="panel-cabecera">
      <div>
        <h2>Ranking de empresas</h2>
        <p>Ranking de empresas según su variación diaria.</p>
      </div>
    </div>

    <div class="tabla-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Empresa</th>
            <th>Precio</th>
            <th>Variación</th>
            <th>Volumen</th>
            <th>Capitalización</th>
          </tr>
        </thead>
        <tbody id="ranking"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const empresas = [
  {nombre:"Apple", ticker:"AAPL", precio:210.40, variacion:1.8, volumen:75, capitalizacion:3100},
  {nombre:"Microsoft", ticker:"MSFT", precio:455.20, variacion:0.9, volumen:33, capitalizacion:3400},
  {nombre:"NVIDIA", ticker:"NVDA", precio:175.30, variacion:4.6, volumen:132, capitalizacion:4200},
  {nombre:"Amazon", ticker:"AMZN", precio:226.10, variacion:2.1, volumen:58, capitalizacion:2400},
  {nombre:"Tesla", ticker:"TSLA", precio:248.70, variacion:-1.7, volumen:98, capitalizacion:790},
  {nombre:"Meta", ticker:"META", precio:565.80, variacion:1.3, volumen:24, capitalizacion:1450}
];

const ranking = document.getElementById("ranking");

function formatoCapitalizacion(valor) {
  return valor.toLocaleString("es-ES") + " mil M $";
}

function pintarRanking() {
  const ordenadas = [...empresas].sort((a,b) => b.variacion - a.variacion);
  ranking.innerHTML = "";

  ordenadas.forEach((empresa, indice) => {
    const fila = document.createElement("tr");
    const clase = empresa.variacion >= 0 ? "positivo" : "negativo";
    const signo = empresa.variacion > 0 ? "+" : "";

    fila.innerHTML = `
      <td class="puesto">${indice + 1}</td>
      <td>
        <div class="empresa">
          <strong>${empresa.nombre}</strong>
          <span class="ticker">${empresa.ticker}</span>
        </div>
      </td>
      <td>${empresa.precio.toFixed(2)} €</td>
      <td class="${clase}">${signo}${empresa.variacion.toFixed(1)} %</td>
      <td>${empresa.volumen} M</td>
      <td>${formatoCapitalizacion(empresa.capitalizacion)}</td>
    `;

    ranking.appendChild(fila);
  });
}




pintarRanking();
</script>
</body>
</html>
